name: Deploy WebGL to Itch.io

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'Build_Web/**'
      - '.github/workflows/deploy-itch.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Itch.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Itch.io via Butler
        uses: Oval-Tutu/publish-to-itch-with-butler@v1.1.2
        with:
          api-key: ${{ secrets.BUTLER_API_KEY }}
          channel: html5
          itch_game: via-simulation-jeep
          itch_user: taiau
          package: ./Build_Web
          version: ${{ github.sha }}
