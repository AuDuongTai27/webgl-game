name: Deploy WebGL to Itch.io

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'Build_Web/**'
      - '.github/workflows/deploy-itch.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Itch.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Butler (Official CLI)
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d bin/
          chmod +x bin/butler
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Verify Butler
        run: butler -V

      - name: Deploy to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push Build_Web taiau/via-simulation-jeep:html5 --userversion ${{ github.sha }}
